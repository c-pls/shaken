name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Hagane Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set Gradle Permissions
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/hagane.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hagane-apk
          path: release-output/hagane.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: "Hagane v1.3.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ## ⚔️ Hagane - Forge Your Steel APK
            > *"Forge your steel"*

            Download and install the APK directly on your Samsung Galaxy or Android phone:
            👉 **[Download hagane.apk](https://github.com/${{ github.repository }}/releases/download/v1.3.${{ github.run_number }}/hagane.apk)**

            ---
            ### ✨ What's new in Hagane v1.3:
            - **New Identity & Twin Katana Logo**: Rebranded to **Hagane** with sleek Katana Barbell branding across Android and Garmin.
            - **⌚ Garmin Forerunner 255 Watch Integration**: Custom English-only strength workout companion app (`type="watch-app"`) with live Heart Rate, set tracking, and native `.FIT` recording.
            - **⏱ Per-Exercise Rest Timers**: Custom rest countdowns (`2:30` compound, `1:30` isolation, `1:00` warm-up) with 360° watch progress ring and overtime tracking.
            - **⚡ Superset 0s Transitions**: Automatic chaining between paired exercises without interruption.
            - **Compact Hevy-Style Exercise Picker**: Search bar right at the top bar, displaying 7–8 exercises above the phone keyboard, with `Most used` / `All exercises` tabs and circular `(?)` preview buttons.
            - **197 Offline Exercises**: Full 1080p 30-FPS male demo videos bundled directly in the app.
            - **1-Click Language Switcher**: Tap `🇺🇸 EN` or `🇻🇳 VI` in the header for instant switching.
            - **Offline & Backup**: 100% offline functionality with persistent device storage.

            ---
            ### 📱 How to install on your Samsung Galaxy (Android):
            1. Tap the download link above in Samsung Internet or Chrome on your phone.
            2. Tap the downloaded file `hagane.apk`.
            3. Tap **Install** / **Update**.
            4. Open **Hagane** and enjoy your workouts!
          files: |
            release-output/hagane.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        run: |
          echo "### ⚔️ Hagane Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The official Android APK for **Hagane** has been built, signed, uploaded as an artifact, and published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to install on your Samsung Galaxy (Android):" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Releases** tab on your GitHub repository (or download from the release link above)." >> $GITHUB_STEP_SUMMARY
          echo "2. Tap \`hagane.apk\` to download and install directly on your phone." >> $GITHUB_STEP_SUMMARY
